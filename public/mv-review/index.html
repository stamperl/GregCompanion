<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Click Foundry MV Review</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#080d0c; color:#edf7f3; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(#101817,#080d0c); }
    header { position:sticky; top:0; z-index:5; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; background:#111a18f2; border-bottom:2px solid #a88b45; }
    h1 { margin:0; font-size:1.2rem; letter-spacing:0; }
    header p { margin:4px 0 0; color:#aebbb7; font-size:.8rem; }
    nav { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:10px; }
    button, input, select, textarea { font:inherit; }
    nav button, .review-actions button { min-height:42px; border:1px solid #596b66; background:#192321; color:#e9f4ef; font-weight:800; }
    nav button.active { background:#725f25; border-color:#e7cc69; color:white; }
    main { padding:12px 12px calc(30px + env(safe-area-inset-bottom)); max-width:1180px; margin:auto; }
    .toolbar { display:grid; grid-template-columns:1fr minmax(140px, 190px) auto; gap:7px; margin-bottom:4px; }
    .sync-status { color:#9fb0aa; font-size:.72rem; margin:0 0 10px; min-height:1em; }
    .sync-status.error { color:#ff9b9b; }
    input, select, textarea { width:100%; background:#0d1413; color:#eef8f4; border:1px solid #4c5c58; padding:10px; border-radius:0; }
    .grid { display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
    article { background:#111918; border:1px solid #41514d; border-left:4px solid #a88b45; padding:9px; min-width:0; }
    article h2 { font-size:.95rem; margin:0; }
    article p { color:#aebbb7; font-size:.78rem; line-height:1.35; }
    .identity { display:grid; grid-template-columns:64px 1fr; gap:9px; align-items:center; }
    img { width:64px; height:64px; object-fit:contain; image-rendering:pixelated; }
    .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
    .chip { padding:3px 6px; background:#202b29; border:1px solid #52645f; color:#dce9e4; font:700 .7rem ui-monospace,monospace; }
    .flow { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; margin-top:8px; font-size:.72rem; }
    .flow > div { background:#0a100f; border:1px solid #35443f; padding:6px; min-height:52px; }
    .metrics { color:#71d5c7; font:700 .72rem ui-monospace,monospace; margin-top:7px; }
    .review-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:8px; }
    .review-actions button[data-value="approve"].selected { background:#22694f; }
    .review-actions button[data-value="reject"].selected { background:#7b3034; }
    textarea { min-height:58px; margin-top:5px; resize:vertical; }
    .dependency { border-left-color:#5dc8b8; }
    .dependency ol { margin:8px 0 0; padding-left:20px; color:#c8d7d2; line-height:1.5; }
    .empty { color:#94a29d; padding:30px 4px; text-align:center; }
    @media (max-width:520px) {
      nav { grid-template-columns:repeat(2,1fr); }
      .grid { grid-template-columns:1fr; }
      .toolbar { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MV Engineering Review</h1>
    <p>Material forms, circuit dependencies, all MV machines, and resolved inherited recipes.</p>
    <nav id="tabs"></nav>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search review records" />
      <select id="status-filter" aria-label="Filter review status">
        <option value="all">All decisions</option>
        <option value="reject">Rejected only</option>
        <option value="changes">Changes only</option>
        <option value="approve">Approved only</option>
        <option value="pending">Pending only</option>
      </select>
      <button id="export">Export decisions</button>
    </div>
    <p id="sync-status" class="sync-status">Preparing review sync…</p>
    <section id="content"></section>
  </main>
  <script type="module">
    const reviewVersion = Date.now()
    const data = await fetch(`./data.json?v=${reviewVersion}`, { cache: 'no-store' }).then(response => response.json())
    const tabs = ['Dependencies', 'Icons', 'Machines', 'Recipes']
    const decisions = JSON.parse(localStorage.getItem('click-foundry-mv-review') || '{}')
    const focusRejected = new URLSearchParams(location.search).get('focus') === 'rejected'
    let active = focusRejected ? 'Icons' : 'Dependencies'
    let query = ''
    let statusFilter = focusRejected ? 'reject' : 'all'

    const icon = (kind, id) => `../icon-reviews/mv-engineering/candidates/${kind}/${id}.png?v=${reviewVersion}`
    const runtimeIcon = (kind, id) => `../game-icons/${kind}/${id}.png?v=${reviewVersion}`
    const iconTag = (kind, id) =>
      `<img src="${icon(kind, id)}" alt="" onerror="this.onerror=null;this.src='${runtimeIcon(kind, id)}'">`
    const labelAmount = value => value ? `${value.id} x${value.amount}` : 'None'
    const recipeInputs = recipe => [recipe.input, recipe.secondaryInput, ...(recipe.extraInputs || [])].filter(Boolean)
    const recipeOutputs = recipe => [recipe.output, recipe.secondaryOutput].filter(Boolean)
    let syncTimer

    async function syncDecisions() {
      const status = document.querySelector('#sync-status')
      status.classList.remove('error')
      status.textContent = 'Syncing review decisions…'
      try {
        const response = await fetch('/api/reviews/mv', {
          method: 'PUT',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ decisions }),
        })
        if (!response.ok) throw new Error(`Review sync returned ${response.status}`)
        const result = await response.json()
        status.textContent = `Review decisions synced to PC at ${new Date(result.updatedAt).toLocaleTimeString()}.`
      } catch (error) {
        status.classList.add('error')
        status.textContent = `Review sync failed: ${error.message}`
      }
    }

    function saveDecisions() {
      localStorage.setItem('click-foundry-mv-review', JSON.stringify(decisions))
      clearTimeout(syncTimer)
      syncTimer = setTimeout(syncDecisions, 180)
    }

    function reviewControls(key) {
      const state = decisions[key] || {}
      return `<div class="review-actions">
        ${['approve','changes','reject'].map(value => `<button data-key="${key}" data-value="${value}" class="${state.status === value ? 'selected' : ''}">${value}</button>`).join('')}
      </div><textarea data-note="${key}" placeholder="Review note">${state.note || ''}</textarea>`
    }

    function dependencies() {
      const cards = [
        ['LV Circuit Backfill', ['Wood Pulp -> Wooden Board Blank -> Coated Board Blank', 'Copper Foil -> Fine Copper Wire', 'Resistor + Vacuum Tube + Red Alloy Cable + Steel Item Casing', 'Basic Electronic Circuit (hand only)']],
        ['MV Semiconductor Chain', ['Sphalerite + Realgar', 'Gallium + Arsenic -> Gallium Arsenide Crystal', 'GaAs Dust -> Diodes', 'Phenolic Board + Fine Gold Wire + Sulfuric Acid -> MV Circuit Board', 'Good Electronic Circuit (hand only)']],
        ['MV Machine Bootstrap', ['Aluminium Casing -> MV Hull', 'MV Motor -> Piston / Pump / Conveyor', 'Upgrade matching LV machine', 'Run LV recipes at 1/2 duration, 2x total EU, 4x live draw']],
        ['MV Power', ['MV Lithium Battery: 16,384 EU', '1/2/4/8A MV buffers', '128 EU/s per installed battery', '1/2/4/8A aluminium cable with 2 EU loss per tile']],
      ]
      return `<div class="grid">${cards.map(([name, steps]) => `<article class="dependency"><h2>${name}</h2><ol>${steps.map(step => `<li>${step}</li>`).join('')}</ol></article>`).join('')}</div>`
    }

    function iconsView() {
      const records = [
        ...data.resources.map(resource => ({ kind:'resources', id:resource.id, name:resource.label, detail:`${resource.category} / ${resource.tier}` })),
        ...data.machines.map(machine => ({ kind:'machines', id:machine.id, name:machine.name, detail:`${machine.processKind} / ${machine.tier}` })),
      ].filter(record => {
        const status = decisions[`icon:${record.id}`]?.status || 'pending'
        return `${record.name} ${record.id}`.toLowerCase().includes(query)
          && (statusFilter === 'all' || status === statusFilter)
      })
      return `<div class="grid">${records.map(record => `<article><div class="identity">${iconTag(record.kind, record.id)}<div><h2>${record.name}</h2><p>${record.id}<br>${record.detail}</p></div></div>${reviewControls(`icon:${record.id}`)}</article>`).join('')}</div>`
    }

    function machinesView() {
      const records = data.machines.filter(machine => `${machine.name} ${machine.id}`.toLowerCase().includes(query))
      return `<div class="grid">${records.map(machine => `<article><div class="identity">${iconTag('machines', machine.id)}<div><h2>${machine.name}</h2><p>${machine.description}</p></div></div><div class="chips"><span class="chip">${machine.euVoltage || 128} V</span><span class="chip">${machine.euCapacity || 0} EU buffer</span><span class="chip">${machine.processKind}</span></div>${reviewControls(`machine:${machine.id}`)}</article>`).join('')}</div>`
    }

    function recipesView() {
      const crafting = data.craftingRecipes.map(recipe => ({ ...recipe, source:'Crafting', left:recipe.inputs, right:recipe.outputs, machines:recipe.machineOutputs }))
      const processing = data.processRecipes.map(recipe => ({ ...recipe, source:recipe.machineId, left:recipeInputs(recipe), right:recipeOutputs(recipe) }))
      const records = [...crafting, ...processing].filter(recipe => `${recipe.name} ${recipe.id} ${recipe.source}`.toLowerCase().includes(query))
      return `<div class="grid">${records.map(recipe => `<article><h2>${recipe.name}</h2><p>${recipe.id}</p><div class="flow"><div>${(recipe.left || []).map(labelAmount).join('<br>') || 'No item input'}</div><strong>-></strong><div>${(recipe.right || []).map(labelAmount).join('<br>') || (recipe.machines || []).map(labelAmount).join('<br>') || 'Machine output'}</div></div><div class="metrics">${recipe.source} | ${(recipe.durationMs/1000).toFixed(1)}s | ${recipe.euCost || 0} EU ${recipe.programNumber ? `| Program ${recipe.programNumber}` : ''}</div>${reviewControls(`recipe:${recipe.id}`)}</article>`).join('')}</div>`
    }

    function render() {
      document.querySelector('#tabs').innerHTML = tabs.map(tab => `<button class="${tab === active ? 'active' : ''}" data-tab="${tab}">${tab}</button>`).join('')
      const views = { Dependencies:dependencies, Icons:iconsView, Machines:machinesView, Recipes:recipesView }
      document.querySelector('#content').innerHTML = views[active]()
      document.querySelectorAll('[data-tab]').forEach(button => button.onclick = () => { active = button.dataset.tab; render() })
      document.querySelectorAll('[data-key]').forEach(button => button.onclick = () => {
        const key = button.dataset.key
        decisions[key] = { ...(decisions[key] || {}), status:button.dataset.value }
        saveDecisions()
        render()
      })
      document.querySelectorAll('[data-note]').forEach(area => area.onchange = () => {
        const key = area.dataset.note
        decisions[key] = { ...(decisions[key] || {}), note:area.value }
        saveDecisions()
      })
    }
    document.querySelector('#search').oninput = event => { query = event.target.value.toLowerCase(); render() }
    document.querySelector('#status-filter').value = statusFilter
    document.querySelector('#status-filter').onchange = event => { statusFilter = event.target.value; render() }
    document.querySelector('#export').onclick = () => {
      const blob = new Blob([JSON.stringify({ generatedAt:data.generatedAt, decisions }, null, 2)], { type:'application/json' })
      const link = Object.assign(document.createElement('a'), { href:URL.createObjectURL(blob), download:'mv-review-decisions.json' })
      link.click()
    }
    syncDecisions()
    render()
  </script>
</body>
</html>
