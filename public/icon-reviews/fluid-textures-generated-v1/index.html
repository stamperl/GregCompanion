<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generated Fluid Texture Review</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0b1011;
        color: #f3e9bd;
        font: 15px system-ui, sans-serif;
      }
      main { width: min(980px, calc(100% - 18px)); margin: 16px auto 44px; }
      h1 { margin: 0 0 6px; font-size: clamp(22px, 6vw, 34px); letter-spacing: 0; }
      .intro { margin: 0 0 16px; color: #aab9b4; line-height: 1.45; }
      .legend {
        display: flex;
        gap: 16px;
        margin-bottom: 14px;
        color: #d6cfae;
        font-size: 12px;
        font-weight: 750;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(184px, 1fr));
        gap: 9px;
      }
      figure {
        margin: 0;
        padding: 10px;
        border: 1px solid #465653;
        background: #151e1d;
      }
      .preview {
        display: grid;
        grid-template-columns: 1fr 46px 42px;
        align-items: end;
        gap: 8px;
        min-height: 134px;
        padding: 8px;
        border: 1px solid #283432;
        background:
          linear-gradient(45deg, #111 25%, transparent 25%),
          linear-gradient(-45deg, #111 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #111 75%),
          linear-gradient(-45deg, transparent 75%, #111 75%),
          #242a29;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }
      img { display: block; object-fit: contain; }
      .large { width: min(112px, 100%); aspect-ratio: 1; justify-self: center; }
      .slot-wrap {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 2px solid #a99b66;
        background: #d7d4cd;
        box-shadow: inset 2px 2px #fff, inset -2px -2px #6a685f;
      }
      .slot { width: 34px; height: 34px; }
      .sight-glass {
        position: relative;
        width: 32px;
        height: 96px;
        overflow: hidden;
        border: 3px solid #596663;
        background: #071011;
        box-shadow: inset 0 0 0 2px #111, 0 0 8px #000;
      }
      .sight-glass img {
        position: absolute;
        inset: 19px -18px -2px;
        width: 64px;
        height: 80px;
        max-width: none;
        object-fit: cover;
      }
      figcaption { margin-top: 8px; font-weight: 800; }
      small { display: block; margin-top: 2px; color: #8fa09b; font-weight: 450; }
      @media (max-width: 430px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        figure { padding: 7px; }
        .preview { grid-template-columns: 1fr 38px; min-height: 122px; gap: 4px; }
        .large { width: 94px; }
        .slot-wrap { width: 38px; height: 38px; }
        .slot { width: 29px; height: 29px; }
        .sight-glass { grid-column: 2; width: 30px; height: 62px; justify-self: center; }
        .sight-glass img { inset: 10px -17px -2px; width: 60px; height: 58px; }
        figcaption { font-size: 13px; overflow-wrap: anywhere; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Generated Fluid Textures</h1>
      <p class="intro">Candidate v1. These are individual generated PNG images, not CSS sprites. Each fluid is shown as source artwork, at terminal-slot size, and clipped inside a Super Tank sight glass.</p>
      <div class="legend"><span>Large</span><span>34px slot</span><span>Tank glass</span></div>
      <div class="grid" id="grid"></div>
    </main>
    <script>
      const fluids = [
        ["water", "Water", "Clear ripples and depth"],
        ["creosote", "Creosote", "Dark oily amber"],
        ["liquidRubber", "Liquid Rubber", "Elastic black latex"],
        ["glue", "Glue", "Sticky amber strands"],
        ["air", "Air", "Pale moving wisps"],
        ["oxygen", "Oxygen", "Bright active cyan"],
        ["nitrogen", "Nitrogen", "Cold indigo currents"],
        ["sulfuricAcid", "Sulfuric Acid", "Caustic yellow-green"],
        ["dilutedSulfuricAcid", "Diluted Sulfuric Acid", "Pale watery acid"],
        ["woodTar", "Wood Tar", "Fibrous red-black tar"],
        ["woodGas", "Wood Gas", "Warm smoky vapour"],
        ["benzene", "Benzene", "Clear pale amber"],
        ["heavyTar", "Heavy Tar", "Dense black sludge"],
        ["caneJuice", "Cane Juice", "Green fibrous pulp"],
        ["sugarWash", "Sugar Wash", "Dissolving golden sugar"],
        ["fermentedWash", "Fermented Wash", "Foam and active bubbles"],
        ["carbonDioxide", "Carbon Dioxide", "Dense silver bubbles"],
        ["ethanol", "Ethanol", "Clean ice-blue spirit"],
        ["vinasse", "Vinasse", "Dark organic sediment"],
        ["ethylene", "Ethylene", "Fast turquoise gas"],
        ["liquidPolyethylene", "Liquid Polyethylene", "Pearl molten polymer"],
        ["fertilizerLiquor", "Fertilizer Liquor", "Mineral-rich olive liquor"]
      ];
      document.querySelector("#grid").innerHTML = fluids.map(([id, name, note]) => `
        <figure>
          <div class="preview">
            <img class="large" src="candidates/${id}.png" alt="${name}">
            <span class="slot-wrap"><img class="slot" src="candidates/${id}.png" alt=""></span>
            <span class="sight-glass"><img src="candidates/${id}.png" alt=""></span>
          </div>
          <figcaption>${name}<small>${note}</small></figcaption>
        </figure>
      `).join("");
    </script>
  </body>
</html>
