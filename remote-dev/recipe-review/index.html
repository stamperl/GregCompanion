<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111816" />
  <title>Click Foundry Recipe Review</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span>Development tool</span>
        <h1>Recipe Review</h1>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="import-button" title="Import review file" aria-label="Import review file">↥</button>
        <button class="icon-button" id="copy-button" title="Copy review patch" aria-label="Copy review patch">⧉</button>
        <button class="accent-button" id="export-button">Export</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <section class="filterbar">
      <label class="search-field">
        <span class="sr-only">Search recipes</span>
        <input id="search" type="search" placeholder="Search recipes or ingredients" autocomplete="off" />
      </label>
      <div class="segmented-control" id="review-filter" aria-label="Review filter">
        <button data-filter="all" class="active">All</button>
        <button data-filter="unreviewed">To review</button>
        <button data-filter="edited">Edited</button>
        <button data-filter="flagged">Flagged</button>
      </div>
      <div class="segmented-control kind-control" id="kind-filter" aria-label="Recipe type">
        <button data-kind="crafting" class="active">Crafting</button>
        <button data-kind="process">Machines</button>
      </div>
      <div class="catalogue-status" id="catalogue-status">Loading recipes...</div>
    </section>

    <main class="workbench">
      <aside class="recipe-browser" aria-label="Recipe list">
        <div id="recipe-list" class="recipe-list"></div>
      </aside>

      <section id="recipe-editor" class="recipe-editor" aria-live="polite">
        <div class="loading-state">Loading crafting catalogue...</div>
      </section>
    </main>
  </div>

  <dialog id="item-picker" class="item-picker">
    <div class="picker-header">
      <div>
        <span id="picker-eyebrow">Grid slot</span>
        <h2 id="picker-title">Choose item</h2>
      </div>
      <button class="icon-button" id="picker-close" aria-label="Close item picker">×</button>
    </div>
    <input id="picker-search" class="picker-search" type="search" placeholder="Find an item" autocomplete="off" />
    <div id="picker-items" class="picker-items"></div>
    <div class="picker-footer">
      <button id="picker-clear" class="danger-button">Clear slot</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
