<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymer Works Icon Review</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0c1112; color: #edf1ef; font: 15px system-ui, sans-serif; }
      main { width: min(940px, calc(100% - 20px)); margin: 18px auto 44px; }
      h1 { margin: 0 0 6px; font-size: 24px; }
      p { margin: 0 0 18px; color: #aebbb7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 9px; }
      figure { margin: 0; padding: 10px; border: 1px solid #42504d; background: #17201f; }
      .preview { align-items: end; background: #070b0c; display: flex; gap: 12px; justify-content: center; min-height: 138px; }
      img { image-rendering: auto; object-fit: contain; }
      .large { height: 110px; width: 110px; }
      .slot { height: 38px; width: 38px; }
      figcaption { margin-top: 8px; font-weight: 750; }
      small { color: #8fa09b; display: block; font-weight: 400; margin-top: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Polymer Works</h1>
      <p>Candidate v1. Each original icon is shown at factory and inventory-slot sizes.</p>
      <div class="grid">
        <figure><div class="preview"><img class="large" src="candidates/bagasse.png" alt="Bagasse"><img class="slot" src="candidates/bagasse.png" alt=""></div><figcaption>Bagasse<small>Extractor byproduct</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/plateMold.png" alt="Plate Mold"><img class="slot" src="candidates/plateMold.png" alt=""></div><figcaption>Plate Mold<small>Reusable solidifier tool</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/polyethylenePlate.png" alt="Polyethylene Plate"><img class="slot" src="candidates/polyethylenePlate.png" alt=""></div><figcaption>Polyethylene Plate<small>Solidified plastic</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/polyethylenePipe.png" alt="Polyethylene Pipe"><img class="slot" src="candidates/polyethylenePipe.png" alt=""></div><figcaption>Polyethylene Pipe<small>Six-plate liner</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/tankCasing1.png" alt="Tank Casing I"><img class="slot" src="candidates/tankCasing1.png" alt=""></div><figcaption>Tank Casing I<small>Steel pressure casing</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/pulsatingIronIngot.png" alt="Pulsating Iron Ingot"><img class="slot" src="candidates/pulsatingIronIngot.png" alt=""></div><figcaption>Pulsating Iron Ingot<small>Phase alloy</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/pulsatingIronPlate.png" alt="Pulsating Iron Plate"><img class="slot" src="candidates/pulsatingIronPlate.png" alt=""></div><figcaption>Pulsating Iron Plate<small>Tank control plate</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/lvFluidSolidifier.png" alt="LV Fluid Solidifier"><img class="slot" src="candidates/lvFluidSolidifier.png" alt=""></div><figcaption>LV Fluid Solidifier<small>Machine</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/lvSuperTank.png" alt="LV Super Tank I"><img class="slot" src="candidates/lvSuperTank.png" alt=""></div><figcaption>LV Super Tank I<small>4,000,000L single block</small></figcaption></figure>
      </div>
    </main>
  </body>
</html>
