<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benzene Power Icon Review</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #101315; color: #edf1ef; font: 15px system-ui, sans-serif; }
      main { width: min(920px, calc(100% - 24px)); margin: 24px auto 48px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #b8c2be; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
      figure { margin: 0; padding: 12px; border: 1px solid #46504c; background: #1b211f; }
      .preview { display: flex; min-height: 142px; align-items: end; justify-content: center; gap: 14px; background: #0a0d0c; }
      img { object-fit: contain; }
      .large { width: 112px; height: 112px; }
      .slot { width: 36px; height: 36px; }
      figcaption { margin-top: 9px; font-weight: 700; }
      small { display: block; margin-top: 3px; color: #92a09a; font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <h1>Benzene Power</h1>
      <p>Candidate v1. Each icon is shown at factory size and inventory-slot size.</p>
      <div class="grid">
        <figure><div class="preview"><img class="large" src="candidates/lvWaterSource.png" alt="LV Water Source"><img class="slot" src="candidates/lvWaterSource.png" alt=""></div><figcaption>LV Water Source<small>Machine</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/poweredFarm.png" alt="Powered Farm"><img class="slot" src="candidates/poweredFarm.png" alt=""></div><figcaption>Powered Farm<small>Formed multiblock</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/poweredFarmPart.png" alt="Powered Farm Block"><img class="slot" src="candidates/poweredFarmPart.png" alt=""></div><figcaption>Powered Farm Block<small>Casing part</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/pyrolysisOven.png" alt="Pyrolysis Oven"><img class="slot" src="candidates/pyrolysisOven.png" alt=""></div><figcaption>Pyrolysis Oven<small>Formed multiblock</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/pyrolysisOvenPart.png" alt="Pyrolysis Oven Block"><img class="slot" src="candidates/pyrolysisOvenPart.png" alt=""></div><figcaption>Pyrolysis Oven Block<small>Casing part</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/lvDistillery.png" alt="LV Distillery"><img class="slot" src="candidates/lvDistillery.png" alt=""></div><figcaption>LV Distillery<small>Machine</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/lvCombustionGenerator.png" alt="LV Combustion Generator"><img class="slot" src="candidates/lvCombustionGenerator.png" alt=""></div><figcaption>LV Combustion Generator<small>32 EU/s</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/mvCombustionGenerator.png" alt="MV Combustion Generator"><img class="slot" src="candidates/mvCombustionGenerator.png" alt=""></div><figcaption>MV Combustion Generator<small>128 EU/s</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/lvToMvTransformer.png" alt="LV to MV Transformer"><img class="slot" src="candidates/lvToMvTransformer.png" alt=""></div><figcaption>LV to MV Transformer<small>Step up</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/mvToLvTransformer.png" alt="MV to LV Transformer"><img class="slot" src="candidates/mvToLvTransformer.png" alt=""></div><figcaption>MV to LV Transformer<small>Step down</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/aluminiumCable.png" alt="Aluminium Cable"><img class="slot" src="candidates/aluminiumCable.png" alt=""></div><figcaption>Aluminium Cable<small>Item and placed cable</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/rubberLog.png" alt="Rubber Log"><img class="slot" src="candidates/rubberLog.png" alt=""></div><figcaption>Rubber Log<small>Farm output</small></figcaption></figure>
        <figure><div class="preview"><img class="large" src="candidates/sugarCane.png" alt="Sugar Cane"><img class="slot" src="candidates/sugarCane.png" alt=""></div><figcaption>Sugar Cane<small>Farm output</small></figcaption></figure>
      </div>
    </main>
  </body>
</html>
